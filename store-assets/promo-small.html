<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 440px; height: 280px; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(120% 90% at 12% 0%, #60a5fa 0%, transparent 42%),
        linear-gradient(160deg, #2563eb 0%, #1d4ed8 48%, #1e3a8a 100%);
    }
    img {
      width: 148px;
      height: 148px;
      border-radius: 36px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, .22);
    }
  </style>
</head>
<body>
  <img src="../icons/icon128.png" alt="">
</body>
</html>
