<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e5e7eb; }
    .bar { height: 56px; display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid #263247; }
    .title { flex: 1; font-weight: 800; }
    button { border: 0; border-radius: 10px; padding: 8px 10px; font-weight: 800; background: #243044; color: #e5e7eb; border: 1px solid #334155; }
    button.primary { background: #60a5fa; color: #07111f; border: 0; }
    .frame { height: 744px; background: #f4f6f9; color: #171b24; padding: 40px 70px; }
    .hero { background: #fff; border-radius: 20px; padding: 28px; max-width: 840px; margin: 0 auto 18px; }
    .eyebrow { color: #255fd6; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .hero h1 { font-size: 36px; letter-spacing: -.04em; margin: 8px 0; }
    .overlay { position: absolute; inset: 0; background: rgba(7,17,31,.72); display: grid; place-items: center; }
    .card { width: 440px; background: #172033; color: #e5e7eb; border: 1px solid #334155; border-radius: 14px; padding: 18px; }
    .card h2 { margin: 0 0 10px; font-size: 16px; }
    .card p { margin: 0 0 10px; color: #c5cddb; font-weight: 500; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="title">Planning a product launch</div>
    <button>Original Conversation</button>
    <button>Download HTML</button>
    <button>PDF</button>
    <button class="primary">Publish 24h Link</button>
  </div>
  <div class="frame">
    <div class="hero">
      <div class="eyebrow">ChatGPT export</div>
      <h1>Planning a product launch</h1>
      <div>12 messages · Clean standalone HTML</div>
    </div>
  </div>
  <div class="overlay">
    <div class="card">
      <h2>Publish a public 24-hour link?</h2>
      <p>This uploads the exported HTML to here.now. Anyone with the link can read this conversation.</p>
      <p>You will only see this notice once.</p>
      <div class="actions">
        <button>Cancel</button>
        <button class="primary">I understand, publish</button>
      </div>
    </div>
  </div>
</body>
</html>
