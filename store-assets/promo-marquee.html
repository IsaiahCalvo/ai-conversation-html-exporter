<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1400px; height: 560px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 520px 1fr;
      background:
        radial-gradient(70% 120% at 8% 10%, #60a5fa 0%, transparent 46%),
        linear-gradient(135deg, #2563eb 0%, #1d4ed8 40%, #172554 100%);
      color: #fff;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .brand { display: grid; place-items: center; }
    .brand img {
      width: 220px;
      height: 220px;
      border-radius: 52px;
      box-shadow: 0 28px 70px rgba(15, 23, 42, .28);
    }
    .preview { display: grid; place-items: center; padding: 48px 64px 48px 0; }
    .card {
      width: 780px;
      height: 420px;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(15, 23, 42, .35);
      display: grid;
      grid-template-rows: 64px 1fr;
    }
    .bar {
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px;
      font-weight: 800;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #60a5fa; }
    .page { padding: 28px 32px; display: grid; gap: 16px; background: #eef2f7; }
    .hero { background: #fff; border-radius: 18px; padding: 22px 24px; }
    .kicker { color: #2563eb; font: 800 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: 34px; letter-spacing: -.04em; margin: 8px 0 0; }
    .msg { background: #fff; border-radius: 16px; padding: 16px 18px; display: grid; gap: 6px; }
    .msg.you { background: #dbeafe; }
    .who { font-size: 12px; font-weight: 800; color: #64748b; }
    .code { background: #0f172a; color: #bfdbfe; border-radius: 10px; padding: 12px 14px; font: 700 14px/1.4 ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="brand"><img src="../icons/icon128.png" alt=""></div>
  <div class="preview">
    <div class="card">
      <div class="bar"><span class="dot"></span> HTML export</div>
      <div class="page">
        <div class="hero">
          <div class="kicker">ChatGPT export</div>
          <h1>Planning a product launch</h1>
        </div>
        <div class="msg you"><div class="who">You</div>Turn this into a portable HTML document.</div>
        <div class="msg">
          <div class="who">Assistant</div>
          <div class="code">1. Capture the conversation<br>2. Download HTML or PDF</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
